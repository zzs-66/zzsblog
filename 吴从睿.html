<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>英灵殿 · 吴从睿</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-bg: #0a0a0a;
            --gold: #c5a047;
            --gold-light: #e5d7a3;
            --card-bg: #1a1a1a;
            --text-light: #e5e5e5;
            --text-dim: #999;
        }
        body {
            background: var(--primary-bg);
            color: var(--text-light);
            font-family: 'Open Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .hero-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 1.2s;
        }
        .hero-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .hero-text {
            text-align: center;
            transform: scale(0.9);
            animation: heroGlow 1.5s ease-out forwards, heroScale 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        @keyframes heroGlow {
            0% { text-shadow: 0 0 0 rgba(197, 160, 71, 0); }
            100% { text-shadow: 0 0 20px rgba(197, 160, 71, 0.6), 0 0 40px rgba(197, 160, 71, 0.3); }
        }
        @keyframes heroScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .hero-text h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            background: linear-gradient(135deg, #c5a047 0%, #f3e6b0 50%, #8a6f3d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            font-weight: 900;
        }
        .hero-text .hero-name {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin-top: 0.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s 0.4s forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .skip-hint {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(197, 160, 71, 0.5);
            font-family: 'Open Sans';
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .skip-hint:hover { color: var(--gold); }
        .main-content {
            opacity: 0;
            transition: opacity 1s ease 0.2s;
        }
        .main-content.visible {
            opacity: 1;
        }
        .particles {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            background: rgba(197, 160, 71, 0.2);
            border-radius: 50%;
            animation: floatParticle 10s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.6; transform: translateY(-30vh) scale(0.8);}
            100% { transform: translateY(0) scale(1); opacity: 0; }
        }
        .nav-container {
            background: linear-gradient(to right, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 2px solid var(--gold);
            padding: 1.2rem 0;
            position: relative;
        }
        .back-btn {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-decoration: none;
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.5rem 1rem;
            border: 1px solid rgba(197, 160, 71, 0.3);
            border-radius: 3px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: rgba(197, 160, 71, 0.1);
            transform: translateY(-50%) translateX(-5px);
        }
        .nav-brand {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .portrait-section {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }
        .portrait {
            width: 320px;
            height: 320px;
            background: var(--card-bg);
            border: 3px solid var(--gold);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .portrait-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .name-title {
            text-align: center;
            margin: 1rem 0;
        }
        .name {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .title {
            font-size: 1rem;
            color: var(--gold-light);
            background: rgba(197, 160, 71, 0.15);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            margin-top: 0.5rem;
        }
        .bio-section {
            background: var(--card-bg);
            border-left: 4px solid var(--gold);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 12px;
        }
        .bio-section p {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1rem;
        }
        .deeds-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            text-align: center;
            margin: 2rem 0 1rem;
            letter-spacing: 2px;
        }
        .deeds-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0 2rem;
        }
        .deed-item {
            background: var(--card-bg);
            border: 1px solid rgba(197, 160, 71, 0.3);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            width: 220px;
            text-align: center;
            transition: all 0.3s;
        }
        .deed-item:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(197, 160, 71, 0.1);
        }
        .deed-item a {
            text-decoration: none;
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            display: block;
        }
        .extra-back {
            text-align: center;
            margin: 2rem 0 1rem;
        }
        .extra-back .back-btn-bottom {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            border-radius: 40px;
            transition: all 0.3s ease;
        }
        .extra-back .back-btn-bottom:hover {
            background: var(--gold);
            color: #0a0a0a;
            box-shadow: 0 0 12px rgba(197, 160, 71, 0.5);
            transform: translateY(-2px);
        }
        footer {
            background: var(--card-bg);
            text-align: center;
            padding: 2rem;
            margin-top: 1rem;
            border-top: 1px solid var(--gold);
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        @media (max-width: 640px) {
            .container { padding: 0 1rem; }
            .portrait { width: 240px; height: 240px; }
            .name { font-size: 1.8rem; }
            .deeds-grid { gap: 1rem; }
            .deed-item { padding: 0.6rem 1.2rem; width: auto; }
            .back-btn { left: 1rem; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
            .hero-text h1 { font-size: 2rem; }
            .hero-text .hero-name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="particles" id="particlesBg"></div>

<div class="hero-screen" id="heroScreen">
    <div class="hero-text">
        <h1>已选择英雄</h1>
        <div class="hero-name" id="heroNameDisplay">吴从睿</div>
    </div>
    <div class="skip-hint" id="skipHint">⚔️ 轻触任意处 进入英灵殿 ⚔️</div>
</div>

<div class="main-content" id="mainContent">
    <nav class="nav-container">
        <a href="宇华人物志.html" class="back-btn">‹ 返回英灵殿</a>
        <div class="nav-brand">英灵殿 · 吴从睿</div>
    </nav>

    <main class="container">
        <div class="portrait-section">
            <div class="portrait" id="portraitBox">
                <img id="personImg" src="" alt="人物肖像" style="display:none;">
                <img id="placeholderIcon" class="portrait-placeholder" src="assets/images/holiday/wcr.jpg" alt="暂无肖像">
            </div>
        </div>

        <div class="name-title">
            <div class="name" id="personName">吴从睿</div>
            <div class="title" id="personTitle">火男</div>
        </div>

        <div class="bio-section">
            <p id="personBio">
                初代屁王，其屁之盛，可令床板崩摧
            </p>
        </div>

        <div class="deeds-title">✦ 传世佳迹 ✦</div>
        <div class="deeds-grid" id="deedsList"></div>

    </main>

    <footer>
        <p>群贤毕至，少长咸集</p>
        <p style="font-size:0.7rem; margin-top:0.5rem;">—— 宇华人物志 · 英灵殿 ——</p>
    </footer>
</div>

<script>
    const personData = {
        name: "吴从睿",
        title: "火男",
        bio: "初代屁王，其屁之盛，可令床板崩摧",
        avatar: "",
        deeds: [
            { name: "屁王的诞生", link: "#" },
            { name: "暂无", link: "#" },
            { name: "暂无", link: "#" }
        ]
    };

    document.getElementById('heroNameDisplay').innerText = personData.name;

    function loadPerson() {
        document.getElementById('personName').innerText = personData.name;
        document.getElementById('personTitle').innerText = personData.title;
        document.getElementById('personBio').innerText = personData.bio;

        const img = document.getElementById('personImg');
        const placeholder = document.getElementById('placeholderIcon');
        if (personData.avatar && personData.avatar.trim() !== "") {
            img.src = personData.avatar;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'block';
        }

        const deedsContainer = document.getElementById('deedsList');
        deedsContainer.innerHTML = '';
        if (personData.deeds && personData.deeds.length > 0) {
            personData.deeds.forEach(deed => {
                const item = document.createElement('div');
                item.className = 'deed-item';
                const link = document.createElement('a');
                link.href = deed.link;
                link.innerText = deed.name;
                item.appendChild(link);
                deedsContainer.appendChild(item);
            });
        } else {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'deed-item';
            emptyMsg.style.borderColor = 'transparent';
            emptyMsg.innerHTML = '<span style="color:#666;">暂无事迹记载</span>';
            deedsContainer.appendChild(emptyMsg);
        }
    }

    function createParticles() {
        const container = document.getElementById('particlesBg');
        if (!container) return;
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 3 + 1;
            particle.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 8 + 4}s;
                animation-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(particle);
        }
    }

    function initHeroTransition() {
        const heroScreen = document.getElementById('heroScreen');
        const mainContent = document.getElementById('mainContent');
        let finished = false;
        function finish() {
            if (finished) return;
            finished = true;
            if (heroScreen.classList.contains('fade-out')) return;
            heroScreen.classList.add('fade-out');
            mainContent.classList.add('visible');
            setTimeout(() => { heroScreen.style.display = 'none'; }, 1300);
        }
        const timer = setTimeout(finish, 2800);
        function skip() {
            clearTimeout(timer);
            finish();
        }
        heroScreen.addEventListener('click', skip);
        heroScreen.addEventListener('touchstart', skip);
        const skipHint = document.getElementById('skipHint');
        if (skipHint) {
            skipHint.addEventListener('click', function(e) { e.stopPropagation(); skip(); });
            skipHint.addEventListener('touchstart', function(e) { e.stopPropagation(); skip(); });
        }
    }

    window.addEventListener('DOMContentLoaded', function() {
        createParticles();
        loadPerson();
        initHeroTransition();
    });
</script>
</body>
</html>
