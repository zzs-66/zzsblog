<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>宇华人物志 | 请选择你的英雄</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-bg: #0a0a0a;
            --gold: #c5a047;
            --gold-light: #e5d7a3;
            --card-bg: #1a1a1a;
            --text-light: #e5e5e5;
            --text-dim: #999;
        }
        body {
            background: var(--primary-bg);
            color: var(--text-light);
            font-family: 'Open Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .hero-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 1.2s;
        }
        .hero-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .hero-text {
            text-align: center;
            transform: scale(0.9);
            animation: heroGlow 1.5s ease-out forwards, heroScale 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        @keyframes heroGlow {
            0% { text-shadow: 0 0 0 rgba(197, 160, 71, 0); }
            100% { text-shadow: 0 0 20px rgba(197, 160, 71, 0.6), 0 0 40px rgba(197, 160, 71, 0.3); }
        }
        @keyframes heroScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .hero-text h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #c5a047 0%, #f3e6b0 50%, #8a6f3d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            font-weight: 900;
        }
        .hero-sub {
            color: var(--gold-light);
            font-family: 'Cinzel';
            letter-spacing: 2px;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeInUp 0.8s 0.6s forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .skip-hint {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(197, 160, 71, 0.5);
            font-family: 'Open Sans';
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .skip-hint:hover { color: var(--gold); }
        .main-content {
            opacity: 0;
            transition: opacity 1s ease 0.2s;
        }
        .main-content.visible { opacity: 1; }
        .nav-container {
            background: linear-gradient(to right, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 2px solid var(--gold);
            padding: 1.2rem 0;
            position: relative;
        }
        .back-btn {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-decoration: none;
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.5rem 1rem;
            border: 1px solid rgba(197, 160, 71, 0.3);
            border-radius: 3px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: rgba(197, 160, 71, 0.1);
            transform: translateY(-50%) translateX(-5px);
        }
        .nav-brand {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .search-area {
            max-width: 600px;
            margin: 2rem auto 0;
            padding: 0 1rem;
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(197, 160, 71, 0.4);
            padding: 0.8rem 1.2rem;
            font-family: 'Open Sans', sans-serif;
            font-size: 1rem;
            color: var(--text-light);
            border-radius: 40px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(197, 160, 71, 0.3);
        }
        .search-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 0.8rem 1.8rem;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.3s;
        }
        .search-btn:hover {
            background: var(--gold);
            color: #0a0a0a;
            box-shadow: 0 0 12px rgba(197, 160, 71, 0.5);
        }
        .search-result-msg {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: var(--gold-light);
            min-height: 2rem;
        }
        .cards-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }
        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            margin-top: 1.5rem;
        }
        .hero-card {
            background: var(--card-bg);
            border: 2px solid rgba(197, 160, 71, 0.3);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(2px);
        }
        .hero-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 20px 30px rgba(197, 160, 71, 0.2);
        }
        .hero-card.highlight {
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(197, 160, 71, 0.8);
            transform: scale(1.02);
        }
        .card-img {
            height: 240px;
            background: linear-gradient(145deg, #2a2a2a 0%, #111 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-img .hero-icon {
            font-size: 5rem;
            opacity: 0.8;
            transition: all 0.3s;
        }
        .hero-card:hover .hero-icon {
            transform: scale(1.1);
            text-shadow: 0 0 15px var(--gold);
        }
        .card-content {
            padding: 1.2rem;
            text-align: center;
            border-top: 1px solid rgba(197, 160, 71, 0.2);
        }
        .hero-name {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }
        .hero-title {
            font-size: 0.8rem;
            color: var(--gold-light);
            margin-bottom: 0.8rem;
            display: inline-block;
            background: rgba(197, 160, 71, 0.15);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        .hero-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .card-footer {
            margin-top: 0.8rem;
            font-size: 0.7rem;
            color: var(--gold);
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .hero-card:hover .card-footer { opacity: 1; }
        .fenye {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 3rem auto 1rem;
        }
        .fenye button {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
        }
        .fenye button:hover:not(:disabled) {
            background: var(--gold);
            color: #0a0a0a;
            box-shadow: 0 0 12px rgba(197, 160, 71, 0.5);
        }
        .fenye button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .ye-ma {
            color: var(--gold-light);
            font-family: 'Cinzel';
            font-size: 1.1rem;
        }
        .particles {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            background: rgba(197, 160, 71, 0.2);
            border-radius: 50%;
            animation: floatParticle 10s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.6; transform: translateY(-30vh) scale(0.8);}
            100% { transform: translateY(0) scale(1); opacity: 0; }
        }
        footer {
            background: var(--card-bg);
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--gold);
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        @media (max-width: 1024px) {
            .heroes-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }
        @media (max-width: 640px) {
            .heroes-grid {
                grid-template-columns: 1fr;
            }
            .hero-text h1 { font-size: 2rem; }
            .cards-container { padding: 0 1rem; }
            .hero-name { font-size: 1.3rem; }
            .card-img { height: 200px; }
            .card-img .hero-icon { font-size: 3.5rem; }
            .back-btn { left: 1rem; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
            .search-area { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="particles" id="particlesBg"></div>

<div class="hero-screen" id="heroScreen">
    <div class="hero-text">
        <h1>请选择你的英雄</h1>
        <div class="hero-sub">✦ 宇华 · 英灵殿 ✦</div>
    </div>
    <div class="skip-hint" id="skipHint">⚔️ 轻触任意处 进入殿堂 ⚔️</div>
</div>

<div class="main-content" id="mainContent">
    <nav class="nav-container">
        <a href="index.html" class="back-btn">‹ 返回主殿</a>
        <div class="nav-brand">宇华人物志</div>
    </nav>

    <div class="search-area">
        <input type="text" id="searchInput" class="search-input" placeholder="输入人物姓名..." autocomplete="off">
        <button id="searchBtn" class="search-btn">🔍 检索</button>
    </div>
    <div id="resultMsg" class="search-result-msg"></div>

    <div class="cards-container">
        <div class="heroes-grid" id="heroGrid"></div>
        <div class="fenye" id="pagination">
            <button id="prevBtn">◀ 上一页</button>
            <span class="ye-ma" id="pageInfo">第 1 / 1 页</span>
            <button id="nextBtn">下一页 ▶</button>
        </div>
    </div>

    <footer>
        <p>© 宇华录 · 群星闪耀时</p>
        <p style="font-size:0.75rem; margin-top:0.5rem;">"群贤毕至，少长咸集。"</p>
    </footer>
</div>

<script>
    const renWuList = [
        { ming: "张震", chengHao: "大胃袋", jianJie: "最猎奇之人。", lianJie: "张震.html", tuBiao: "🍔" },
        { ming: "吴从睿", chengHao: "火男", jianJie: "神秘屁王。", lianJie: "吴从睿.html", tuBiao: "🔥" },
        { ming: "武照森", chengHao: "暂无", jianJie: "最炫压抑之人", lianJie: "武照森.html", tuBiao: "👦" },
        { ming: "张超帆", chengHao: "张志超", jianJie: "依旧凌晨四点。", lianJie: "张超帆.html", tuBiao: "🧑" },
        { ming: "胡建勋", chengHao: "关羽", jianJie: "自带手电筒之人。", lianJie: "胡建勋.html", tuBiao: "🐴" },
        { ming: "邢艺严", chengHao: "蒋介石", jianJie: "海岛最锋利的剑。", lianJie: "#", tuBiao: "👨‍🦲" },
        { ming: "陈墨然", chengHao: "刀哥", jianJie: "不知会不会咬打火机。", lianJie: "#", tuBiao: "🐶" },
        { ming: "王世阳", chengHao: "鸡哥", jianJie: "最高之人。", lianJie: "#", tuBiao: "🐔" },
        { ming: "张奥运", chengHao: "暂无", jianJie: "最呆之人。", lianJie: "#", tuBiao: "🏅" },
        { ming: "李光耀", chengHao: "暂无", jianJie: "最会画本之人。", lianJie: "#", tuBiao: "🎨" }
    ];

    for (let i = renWuList.length; i < 60; i++) {
        renWuList.push({
            ming: "暂无",
            chengHao: "暂无",
            jianJie: "暂无",
            lianJie: "#",
            tuBiao: "❓"
        });
    }

    const pageSize = 4;
    let currentPage = 1;
    let totalPages = Math.ceil(renWuList.length / pageSize);

    const heroGrid = document.getElementById('heroGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultMsg = document.getElementById('resultMsg');

    let currentHighlight = null;

    function renderCards() {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageData = renWuList.slice(start, end);
        heroGrid.innerHTML = '';
        for (let i = 0; i < pageData.length; i++) {
            const p = pageData[i];
            const card = document.createElement('a');
            card.className = 'hero-card';
            card.href = p.lianJie;
            card.setAttribute('data-name', p.ming);
            card.setAttribute('data-global-index', start + i);
            card.innerHTML = `
                <div class="card-img">
                    <div class="hero-icon">${p.tuBiao}</div>
                </div>
                <div class="card-content">
                    <div class="hero-name">${p.ming}</div>
                    <div class="hero-title">${p.chengHao}</div>
                    <div class="hero-desc">${p.jianJie}</div>
                    <div class="card-footer">⟶ 查看英杰录</div>
                </div>
            `;
            heroGrid.appendChild(card);
        }
        pageInfo.innerText = `第 ${currentPage} / ${totalPages} 页`;
        prevBtn.disabled = (currentPage === 1);
        nextBtn.disabled = (currentPage === totalPages);
        if (currentHighlight) {
            currentHighlight.classList.remove('highlight');
            currentHighlight = null;
        }
    }

    function searchPerson() {
        const keyword = searchInput.value.trim();
        if (keyword === "") {
            resultMsg.innerText = "请输入要检索的姓名";
            return;
        }
        const matches = [];
        for (let i = 0; i < renWuList.length; i++) {
            if (renWuList[i].ming.includes(keyword)) {
                matches.push({ index: i, name: renWuList[i].ming });
            }
        }
        if (matches.length === 0) {
            resultMsg.innerText = `未找到包含“${keyword}”的人物`;
            return;
        }
        const target = matches[0];
        const targetPage = Math.floor(target.index / pageSize) + 1;
        resultMsg.innerText = `找到“${target.name}”，位于第 ${targetPage} 页，正在跳转...`;
        if (currentPage === targetPage) {
            highlightAndScroll(target.index);
        } else {
            currentPage = targetPage;
            renderCards();
            setTimeout(() => {
                highlightAndScroll(target.index);
            }, 100);
        }
    }

    function highlightAndScroll(globalIndex) {
        if (currentHighlight) {
            currentHighlight.classList.remove('highlight');
        }
        const cards = document.querySelectorAll('#heroGrid .hero-card');
        let targetCard = null;
        for (let card of cards) {
            if (parseInt(card.getAttribute('data-global-index')) === globalIndex) {
                targetCard = card;
                break;
            }
        }
        if (targetCard) {
            targetCard.classList.add('highlight');
            currentHighlight = targetCard;
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => {
                if (currentHighlight === targetCard) {
                    targetCard.classList.remove('highlight');
                    currentHighlight = null;
                }
            }, 3000);
            resultMsg.innerText = `已定位到“${targetCard.getAttribute('data-name')}”，高亮3秒`;
        } else {
            resultMsg.innerText = "定位失败，请重试";
        }
    }

    searchBtn.addEventListener('click', searchPerson);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchPerson();
    });

    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            resultMsg.innerText = "";
        }
    });
    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            resultMsg.innerText = "";
        }
    });

    function createParticles() {
        const container = document.getElementById('particlesBg');
        if (!container) return;
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 3 + 1;
            particle.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 8 + 4}s;
                animation-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(particle);
        }
    }

    function initHeroTransition() {
        const screen = document.getElementById('heroScreen');
        const main = document.getElementById('mainContent');
        let finished = false;
        function finish() {
            if (finished) return;
            finished = true;
            if (screen.classList.contains('fade-out')) return;
            screen.classList.add('fade-out');
            main.classList.add('visible');
            setTimeout(() => { screen.style.display = 'none'; }, 1300);
        }
        const timer = setTimeout(finish, 3200);
        function skip() {
            clearTimeout(timer);
            finish();
            document.removeEventListener('click', skip);
            document.removeEventListener('touchstart', skip);
        }
        document.addEventListener('click', skip);
        document.addEventListener('touchstart', skip);
    }

    window.addEventListener('DOMContentLoaded', () => {
        createParticles();
        renderCards();
        initHeroTransition();
    });
</script>
</body>
</html>
